name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dev toolchain (vitest, tsup) needs Node 22.18+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Fails if src/codes.generated.ts no longer matches the installed Better Auth.
      - run: npm run sync:check
      # Fails if any Better Auth code has no Arabic translation.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run smoke
      - run: npm run docs:build
      - run: npm pack --dry-run

  # The published package supports Node 18+, even though building it needs a newer Node.
  runtime-compat:
    name: built package on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs
